included:
  - FlexomBar

excluded:
  - .build
  - DerivedData

opt_in_rules:
  - closure_spacing
  - contains_over_filter_is_empty
  - empty_count
  - empty_string
  - explicit_init
  - fatal_error_message
  - first_where
  - modifier_order
  - redundant_nil_coalescing
  - toggle_bool
  - unneeded_parentheses_in_closure_argument
  - yoda_condition

disabled_rules:
  - todo
  # `String(decoding:as:)` is preferred: non-failable, replaces invalid bytes.
  - optional_data_string_conversion

file_length:
  warning: 800
  error: 2000

type_body_length:
  warning: 500
  error: 900

line_length:
  warning: 140
  error: 200
  ignores_urls: true

identifier_name:
  min_length:
    warning: 2
  excluded:
    - id

reporter: "xcode"
